name: Windows Portable Build & Release

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Test & Publish Windows x64 Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build PluginShelf (Release)
        run: dotnet build PluginShelf/PluginShelf.csproj -c Release -p:EnableWindowsTargeting=true --nologo

      - name: Run Core Tests (Fixtures Only)
        run: dotnet run --project tests/PluginShelf.CoreTests/PluginShelf.CoreTests.csproj -c Release

      - name: Publish Portable Windows x64 Single-File Executable
        run: dotnet publish PluginShelf/PluginShelf.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -o artifacts/PluginShelf-Portable

      - name: Bundle run instructions and compute SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = "artifacts/PluginShelf-Portable/PluginShelf.exe"
          if (-not (Test-Path $exePath)) {
            throw "PluginShelf.exe was not produced at $exePath"
          }
          Copy-Item "PluginShelf-Portable/تشغيل.txt" "artifacts/PluginShelf-Portable/تشغيل.txt" -Force
          Copy-Item "PluginShelf/README.md" "artifacts/PluginShelf-Portable/README.md" -Force

          # Remove PDB symbol files if any were emitted alongside the single-file exe
          Get-ChildItem "artifacts/PluginShelf-Portable" -Filter "*.pdb" -ErrorAction SilentlyContinue | Remove-Item -Force

          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sizeBytes = (Get-Item $exePath).Length
          $sizeMB = [math]::Round($sizeBytes / 1MB, 2)
          "$hash  PluginShelf.exe" | Set-Content -Path "artifacts/PluginShelf-Portable/SHA256SUMS.txt" -Encoding UTF8

          Compress-Archive -Path "artifacts/PluginShelf-Portable/*" -DestinationPath "artifacts/PluginShelf-Portable-win-x64.zip" -Force

          Write-Host "=========================================="
          Write-Host "Executable : $exePath"
          Write-Host "Size       : $sizeBytes bytes ($sizeMB MB)"
          Write-Host "SHA-256    : $hash"
          Write-Host "=========================================="

          @(
            "### PluginShelf Portable Windows x64"
            "- **File:** ``PluginShelf.exe``"
            "- **Size:** $sizeBytes bytes ($sizeMB MB)"
            "- **SHA-256:** ``$hash``"
            "- **Signed:** No (unsigned personal utility; Windows SmartScreen may show a warning)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PluginShelf-Portable
          path: |
            artifacts/PluginShelf-Portable/PluginShelf.exe
            artifacts/PluginShelf-Portable/تشغيل.txt
            artifacts/PluginShelf-Portable/README.md
            artifacts/PluginShelf-Portable/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release on v* Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PluginShelf-Portable/PluginShelf.exe
            artifacts/PluginShelf-Portable/تشغيل.txt
            artifacts/PluginShelf-Portable/SHA256SUMS.txt
            artifacts/PluginShelf-Portable-win-x64.zip
          generate_release_notes: true
